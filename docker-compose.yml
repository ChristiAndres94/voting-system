version: '3.8'

services:
  # Bases de datos
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: voting_system
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/postgresql/init:/docker-entrypoint-initdb.d

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  elasticsearch:
    image: elasticsearch:8.8.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  # API Gateway
  api-gateway:
    build: ./gateway/api-gateway
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
    depends_on:
      - postgres
      - redis

  # Dominio 1: Seguridad y Usuarios
  auth-service:
    build: ./services/domain-1-security-users/auth-service
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password123@postgres:5432/voting_system
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  elasticsearch_data:
