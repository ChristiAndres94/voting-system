name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'openjdk'
        java-version: '17'
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Test Auth Service (Python)
      run: |
        cd services/domain-1-security-users/auth-service
        pip install -r requirements.txt
        python -m pytest --cov=app tests/
    
    - name: Test JWT Service (Node.js)
      run: |
        cd services/domain-1-security-users/jwt-token-service
        npm install
        npm test
    
    - name: Build Docker Images
      run: |
        docker build -t auth-service ./services/domain-1-security-users/auth-service
        docker build -t jwt-service ./services/domain-1-security-users/jwt-token-service
